<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마니또 매칭 퀴즈</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #141414 0%, #1f1f1f 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #f5f5f5;
    padding: 32px 16px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #9a9a9a;
    margin-bottom: 30px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #232323;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 10px;
    border: 1px solid #333;
  }
  .row .giver {
    flex: 0 0 100px;
    font-weight: 700;
    font-size: 15px;
  }
  .row .arrow {
    color: #666;
    font-size: 14px;
  }
  select {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #3a3a3a;
    background: #2f2f2f;
    color: #f5f5f5;
  }
  .row.correct { border-color: #2ecc71; background: #14251b; }
  .row.wrong { border-color: #e50914; background: #2a1113; }
  .row .mark { flex: 0 0 24px; font-size: 16px; text-align: center; }
  .row .answer {
    flex: 0 0 auto;
    font-size: 13px;
    color: #ff8a8a;
    display: none;
  }
  .row.wrong .answer { display: inline; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  button {
    flex: 1;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #e50914;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #f6121d; }
  button.secondary { background: #3a3a3a; }
  button.secondary:hover { background: #4a4a4a; }

  .score {
    display: none;
    text-align: center;
    margin-top: 22px;
    padding: 20px;
    border-radius: 12px;
    background: #232323;
    border: 1px solid #444;
    font-size: 20px;
    font-weight: 700;
  }
  .score.show { display: block; }
  .score .big { font-size: 34px; color: #e50914; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 마니또 매칭 퀴즈</h1>
  <div class="subtitle">누가 누구를 챙겨줬는지 맞혀보세요! 각 사람마다 마니또를 골라주세요.</div>

  <div id="rows"></div>

  <div class="actions">
    <button id="checkBtn">채점하기</button>
    <button id="resetBtn" class="secondary">다시 풀기</button>
  </div>

  <div class="score" id="scoreBox">
    <div><span class="big" id="scoreNum">0</span> / 15 정답</div>
  </div>
</div>

<script>
  // 정답 매칭 (전체 공개용 퀴즈 - 게임 종료 후 사용)
  const answer = {
    "유윤경": "김소연",
    "곽혜정": "하동석",
    "오진우": "박종하",
    "김민혜": "이지행",
    "하동석": "신정금",
    "이지행": "김용지",
    "김소연": "염길현",
    "김용지": "김민혜",
    "문석윤": "오진우",
    "박수진": "한예슬",
    "신정금": "문석윤",
    "염길현": "곽혜정",
    "이태영": "유윤경",
    "한예슬": "박수진",
    "박종하": "이태영"
  };

  const givers = Object.keys(answer);
  const receivers = Object.keys(answer).slice(); // same pool of names

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const displayGivers = shuffle(givers);
  const receiverOptions = shuffle(receivers);

  const rowsEl = document.getElementById('rows');

  displayGivers.forEach(giver => {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.giver = giver;

    const giverEl = document.createElement('div');
    giverEl.className = 'giver';
    giverEl.textContent = giver;

    const arrow = document.createElement('div');
    arrow.className = 'arrow';
    arrow.textContent = '→';

    const select = document.createElement('select');
    const emptyOpt = document.createElement('option');
    emptyOpt.value = '';
    emptyOpt.textContent = '-- 선택 --';
    select.appendChild(emptyOpt);
    receiverOptions.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });

    const mark = document.createElement('div');
    mark.className = 'mark';

    const answerSpan = document.createElement('span');
    answerSpan.className = 'answer';

    row.appendChild(giverEl);
    row.appendChild(arrow);
    row.appendChild(select);
    row.appendChild(mark);
    row.appendChild(answerSpan);
    rowsEl.appendChild(row);
  });

  document.getElementById('checkBtn').addEventListener('click', () => {
    let score = 0;
    document.querySelectorAll('.row').forEach(row => {
      const giver = row.dataset.giver;
      const select = row.querySelector('select');
      const mark = row.querySelector('.mark');
      const answerSpan = row.querySelector('.answer');
      const picked = select.value;
      const correct = answer[giver];

      row.classList.remove('correct', 'wrong');
      if (picked === correct) {
        row.classList.add('correct');
        mark.textContent = '✅';
        answerSpan.textContent = '';
        score++;
      } else {
        row.classList.add('wrong');
        mark.textContent = '❌';
        answerSpan.textContent = '정답: ' + correct;
      }
    });

    document.getElementById('scoreNum').textContent = score;
    document.getElementById('scoreBox').classList.add('show');
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    document.querySelectorAll('.row select').forEach(s => s.value = '');
    document.querySelectorAll('.row').forEach(r => r.classList.remove('correct', 'wrong'));
    document.getElementById('scoreBox').classList.remove('show');
  });
</script>
</body>
</html>
